spring:
  datasource:
    url: jdbc:h2:mem:admin_service_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${ADMIN_JWT_SECRET:dGVzdC1hZG1pbi1qd3Qtc2VjcmV0LXdpdGgtZW5vdWdoLWxlbmd0aC1mb3ItaG1hYy0yNTY=}
    expiration: ${ADMIN_JWT_EXPIRATION_MS:86400000}

integration:
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:18080/api}
  user-frontend:
    join-base-url: ${USER_FRONTEND_JOIN_BASE_URL:http://localhost:3000/join}
  internal-api:
    key: ${INTERNAL_API_KEY:test-internal-key}

storage:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:19000}
    access-key: ${S3_ACCESS_KEY:test}
    secret-key: ${S3_SECRET_KEY:test}
    bucket: ${S3_BUCKET:test-bucket}
    region: ${S3_REGION:ru-1}
    presigned-url-ttl-minutes: ${S3_PRESIGNED_URL_TTL_MINUTES:5}

logging:
  level:
    root: WARN
    com.hse.adminservice: INFO
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
    org.flywaydb.core.internal.database.base.Database: ERROR
