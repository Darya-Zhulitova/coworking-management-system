spring:
  application:
    name: admin-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:demo}

  datasource:
    url: ${ADMIN_DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${ADMIN_DB_USERNAME}
    password: ${ADMIN_DB_PASSWORD}

  jpa:
    open-in-view: false
    show-sql: ${ADMIN_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${ADMIN_JPA_FORMAT_SQL:false}
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 75MB
      max-request-size: 75MB

server:
  port: ${ADMIN_SERVICE_PORT:8081}
  servlet:
    context-path: /
  tomcat:
    max-http-form-post-size: 75MB
    max-swallow-size: 75MB

app:
  jwt:
    secret: ${ADMIN_JWT_SECRET}
    expiration: ${ADMIN_JWT_EXPIRATION_MS:86400000}

integration:
  user-service:
    base-url: ${USER_SERVICE_BASE_URL}
  user-frontend:
    join-base-url: ${USER_FRONTEND_JOIN_BASE_URL}
  internal-api:
    key: ${INTERNAL_API_KEY}

storage:
  s3:
    endpoint: ${S3_ENDPOINT}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    bucket: ${S3_BUCKET}
    region: ${S3_REGION}
    presigned-url-ttl-minutes: ${S3_PRESIGNED_URL_TTL_MINUTES:60}

logging:
  level:
    root: INFO
    com.hse.adminservice: ${ADMIN_APP_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${ADMIN_SQL_LOG_LEVEL:WARN}
