spring:
  application:
    name: admin-service

  datasource:
    url: jdbc:h2:mem:admin-db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  profiles:
    active: dev

app:
  jwt:
    secret: 53A73E5F1CBE0A2E3B5F2D784E6A1B423D3F247X1F6E5C3A596D635A75327855
    expiration: 86400000

integration:
  user-service:
    base-url: http://localhost:8080/api
  internal-api:
    key: demo-internal-key

storage:
  s3:
    endpoint: http://127.0.0.1:9000
    public-base-url: http://127.0.0.1:9000
    access-key: rustfsadmin
    secret-key: rustfsadmin
    bucket: coworking-files
    region: local

server:
  port: 8081

logging:
  level:
    root: INFO
    com.hse.adminservice: DEBUG
    org.hibernate.SQL: DEBUG
