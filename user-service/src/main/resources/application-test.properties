spring.datasource.url=${USER_TEST_DB_URL:jdbc:postgresql://localhost:5432/user_service_test}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${USER_TEST_DB_USERNAME:test}
spring.datasource.password=${USER_TEST_DB_PASSWORD:test}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.clean-disabled=false
spring.flyway.locations=classpath:db/migration


integration.admin-service.base-url=${ADMIN_SERVICE_BASE_URL:http://localhost:18081/api}
integration.internal-api.key=${INTERNAL_API_KEY:test-internal-key}

app.jwt.secret=${USER_JWT_SECRET:dGVzdC11c2VyLWp3dC1zZWNyZXQtd2l0aC1lbm91Z2gtbGVuZ3RoLWZvci1obWFjLXNpZ25hdHVyZS0xMjM0NTY3ODkw}
app.jwt.expiration=${USER_JWT_EXPIRATION_MS:86400000}

storage.s3.endpoint=${S3_ENDPOINT:http://localhost:19000}
storage.s3.access-key=${S3_ACCESS_KEY:test}
storage.s3.secret-key=${S3_SECRET_KEY:test}
storage.s3.bucket=${S3_BUCKET:test-bucket}
storage.s3.region=${S3_REGION:ru-1}
storage.s3.presigned-url-ttl-minutes=${S3_PRESIGNED_URL_TTL_MINUTES:5}

spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:test-schema.sql
