spring.application.name=user-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

spring.datasource.url=${USER_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${USER_DB_USERNAME}
spring.datasource.password=${USER_DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.show-sql=${USER_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${USER_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=${USER_SERVICE_PORT:8080}

integration.admin-service.base-url=${ADMIN_SERVICE_BASE_URL}
integration.internal-api.key=${INTERNAL_API_KEY}

app.jwt.secret=${USER_JWT_SECRET}
app.jwt.expiration=${USER_JWT_EXPIRATION_MS:86400000}

storage.s3.endpoint=${S3_ENDPOINT}
storage.s3.access-key=${S3_ACCESS_KEY}
storage.s3.secret-key=${S3_SECRET_KEY}
storage.s3.bucket=${S3_BUCKET}
storage.s3.region=${S3_REGION}
storage.s3.presigned-url-ttl-minutes=${S3_PRESIGNED_URL_TTL_MINUTES:60}

spring.servlet.multipart.max-file-size=75MB
spring.servlet.multipart.max-request-size=75MB
server.tomcat.max-http-form-post-size=75MB
server.tomcat.max-swallow-size=75MB